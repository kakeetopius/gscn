# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: gscn

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./...
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - windows
    goarch:
      - amd64

upx:
  - enabled: true

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - maintainer: "Kakeeto Pius <piusk7003@gmail.com>"
    description: |
      A simple command line tool to carry different scanning operations on a network.

    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    dependencies:
      - libpcap-dev
    provides:
      - gscn
    bindir: /usr/bin
    overrides:
      rpm:
        dependencies:
          - libpcap-devel

release:
  github:
    owner: kakeetopius
    name: gscn
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
